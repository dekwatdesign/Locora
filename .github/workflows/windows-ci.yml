name: Windows CI

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
  workflow_dispatch:

jobs:
  build-test-package:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore Locora.sln

      - name: Build WinUI app
        run: dotnet build src/Locora.App/Locora.App.csproj -c Release -p:Platform=x64 -p:AllowUnsafeBlocks=true

      - name: Test solution
        run: dotnet test Locora.sln -c Release -p:Platform=x64 -p:AllowUnsafeBlocks=true

      - name: Package portable distribution
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag' -and -not [string]::IsNullOrWhiteSpace($env:GITHUB_REF_NAME)) {
            $env:GITHUB_REF_NAME.TrimStart('v')
          }
          else {
            "0.0.0-ci.$($env:GITHUB_RUN_NUMBER)"
          }
          ./scripts/package-portable-release.ps1 -Version $version -Configuration Release -RuntimeIdentifier win-x64

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: locora-portable-win-x64
          if-no-files-found: error
          path: |
            artifacts/dist/*.zip
            artifacts/dist/checksums.txt
            artifacts/dist/release-manifest.json
