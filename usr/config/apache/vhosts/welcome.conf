<VirtualHost *:8080>
    ServerName welcome.locora.test
    DocumentRoot "D:/Projects/Locora/www/welcome"
    DirectoryIndex index.php index.html index.htm

    <Directory "D:/Projects/Locora/www/welcome">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <IfModule rewrite_module>
        RewriteEngine On
    </IfModule>

    # Locora SSL material is not available for this project yet.
    # PHP execution still needs a handler configuration in the Apache scaffold.
</VirtualHost>